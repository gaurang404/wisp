name: Release

# Push a tag like v1.2.0 → signed, notarized Wisp-1.2.0.dmg / .zip attached to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # build number = commit count

      - name: Test
        run: swift test

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Write notarization and update-signing keys
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"

      - name: Build, sign, notarize
        env:
          WISP_VERSION: ${{ github.ref_name }}
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          export WISP_VERSION="${WISP_VERSION#v}"
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          export SPARKLE_PRIVATE_KEY_FILE="$RUNNER_TEMP/sparkle.key"
          ./build.sh
          test -f build/appcast.xml

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          # Stable names too, so https://github.com/<repo>/releases/latest/download/Wisp.dmg always works.
          cp "build/Wisp-$V.dmg" build/Wisp.dmg
          cp "build/Wisp-$V.zip" build/Wisp.zip
          (cd build && shasum -a 256 "Wisp-$V.dmg" "Wisp-$V.zip" > SHA256SUMS.txt)   # bare names so `shasum -c` works
          # appcast.xml is served at https://wisp.build/appcast.xml (redirects to the latest release's copy).
          FILES="build/Wisp-$V.dmg build/Wisp-$V.zip build/Wisp.dmg build/Wisp.zip build/SHA256SUMS.txt build/appcast.xml"
          # Works whether or not a release for this tag already exists (e.g. created on github.com, or a re-run).
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Wisp $V" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" $FILES --title "Wisp $V" --generate-notes
          fi

      - name: Clean up keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key"
